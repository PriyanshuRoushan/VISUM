<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visum Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
          },
          borderRadius: {
            'none': '0px',
            'sm': '4px',
            DEFAULT: '8px',
            'md': '12px',
            'lg': '16px',
            'xl': '20px',
            '2xl': '24px',
            '3xl': '32px',
            'full': '9999px',
            'button': '8px',
          },
          fontFamily: {
            pacifico: ['Pacifico', 'cursive'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">

</head>
<body class="bg-gray-50 font-inter">

  <div class="flex min-h-screen">
    <!-- Left Section -->
    <div class="w-full md:w-1/2 flex flex-col justify-center items-center p-8">
      <div class="w-full max-w-md">

        <h1 class="text-3xl font-bold text-primary mb-6 font-pacifico">VISUM</h1>

        <h2 class="text-2xl font-semibold mb-2">
            <span id="typing-text">Protecting Every Journey</span><span id="typing-animated" class="inline-block"></span>
        </h2>
        <p class="text-gray-500 mb-6">Sign in to your account</p>

        <form>
          <label class="block mb-2 text-sm font-medium text-gray-700">Your Email</label>
          <input type="email" id="loginEmail" placeholder="albert45@mail.com"
            class="w-full px-4 py-2 mb-4 border rounded focus:outline-none focus:ring-2 focus:ring-primary" required />

          <label class="block mb-2 text-sm font-medium text-gray-700">Password</label>
          <div class="relative mb-4">
            <input type="password" id="loginPassword" placeholder=""
              class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-primary" required />
            <i class="ri-eye-line absolute right-3 top-3 text-gray-400 cursor-pointer toggle-password"></i>
          </div>

          <div class="flex items-center justify-between mb-6">
            <label class="flex items-center text-sm text-gray-600">
              <input type="checkbox" class="mr-2" /> Remember Me
            </label>
            <a href="#" class="text-sm text-primary hover:underline">Forgot Password?</a>
          </div>
          <button type="submit"
            class="w-full bg-primary text-white py-2 rounded-button hover:bg-blue-700 transition">Log In</button>
        </form>

        <div class="my-4 flex items-center justify-center text-gray-500">
          <span class="mx-2">Or</span>
        </div>

        <div class="flex space-x-4">
          <button class="w-1/2 flex items-center justify-center border rounded-button py-2 hover:bg-gray-100 transition">
            <i class="ri-google-fill text-lg mr-2"></i> Google
          </button>
          <button class="w-1/2 flex items-center justify-center border rounded-button py-2 hover:bg-gray-100 transition">
            <i class="ri-apple-fill text-lg mr-2"></i> Apple
          </button>
        </div>

        <p class="text-center text-sm text-gray-600 mt-6">
          Don’t have an account?
          <a href="#" class="text-primary hover:underline">Sign up</a>
        </p>

      </div>
    </div>

    <!-- Right Section -->
    <div class="hidden md:flex w-1/2 bg-white items-center justify-center p-8">
      <div class="text-center">
        <div class="grid grid-cols-2 gap-2 mb-6">
          <img src="path/to/image1.jpg" alt="Image 1" class="rounded-xl w-full h-32 object-cover" />
          <img src="path/to/image2.jpg" alt="Image 2" class="rounded-xl w-full h-32 object-cover" />
          <img src="path/to/image3.jpg" alt="Image 3" class="rounded-xl w-full h-32 object-cover" />
          <img src="path/to/image4.jpg" alt="Image 4" class="rounded-xl w-full h-32 object-cover" />
        </div>
        <h3 class="text-xl font-semibold mb-2">For Your and Everyone's Safety</h3>
        <p class="text-gray-600 text-sm">
          The Vision for Future
        </p>
      </div>
    </div>
  </div>

  <script>
    const baseText = "Protecting Every Journey";
    const typingText = document.getElementById("typing-text");
    const typingAnimated = document.getElementById("typing-animated");
    const animatedPart = "...";
    let index = 0;
    let isDeleting = false;

    function type() {
      typingAnimated.textContent = animatedPart.substring(0, index);

      if (!isDeleting && index < animatedPart.length) {
        index++;
        setTimeout(type, 150); // typing speed
      } else if (isDeleting && index > 0) {
        index--;
        setTimeout(type, 150); // deleting speed
      } else {
        isDeleting = !isDeleting;
        setTimeout(type, isDeleting ? 1000 : 500); // pause before deleting/typing again
      }
    }

    // Set static part once
    typingText.textContent = baseText;
    type();
  </script>

</body>
</html>
