<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Location Tracker in Container</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 800px;
      height: 500px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #info {
      background: #ffffff;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    #info h3 {
      margin: 0;
      font-size: 18px;
    }

    #info p {
      margin: 4px 0;
      font-size: 14px;
    }

    #map {
      flex-grow: 1;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="info">
    <h3>Live Location Tracker</h3>
    <p><strong>Latitude:</strong> <span id="lat">Loading...</span></p>
    <p><strong>Longitude:</strong> <span id="lng">Loading...</span></p>
    <p><strong>Accuracy:</strong> <span id="accuracy">Loading...</span> meters</p>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([0, 0], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  var marker = L.marker([0, 0]).addTo(map);
  var accuracyCircle = L.circle([0, 0], { radius: 0, color: 'blue', fillColor: '#cce5ff', fillOpacity: 0.4 }).addTo(map);

  function updateInfo(lat, lng, accuracy) {
    document.getElementById('lat').textContent = lat.toFixed(6);
    document.getElementById('lng').textContent = lng.toFixed(6);
    document.getElementById('accuracy').textContent = accuracy.toFixed(2);
  }

  function updateLocation(position) {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    marker.setLatLng([lat, lng]);
    accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
    map.setView([lat, lng], 16);

    updateInfo(lat, lng, accuracy);
  }

  function locationError(err) {
    console.error(err);
    alert('Unable to retrieve your location.');
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(updateLocation, locationError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 5000
    });
  } else {
    alert('Geolocation is not supported by your browser.');
  }
</script>

</body>
</html>
